name: Large ReFS copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/tree.c, .github/workflows/refs-copy.yml]

permissions:
  contents: read

jobs:
  refs-copy:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Build and run smoke tests
        run: |
          git init
          git fetch --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD
          cmake -S . -B build -A x64
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure

      - name: Measure ReFS copies with SHA-256 verification
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = (Resolve-Path build/Release/stdioctl.exe).Path
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString()))
          $vhd = Join-Path $work.FullName 'stdio-refs.vhdx'
          $diskpartScript = Join-Path $work.FullName 'create.txt'
          ('create vdisk file="{0}" maximum=65536 type=expandable' -f $vhd) | Set-Content -LiteralPath $diskpartScript -Encoding ascii
          try {
            & diskpart /s $diskpartScript
            if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $vhd -PathType Leaf)) {
              throw 'Could not create the test VHDX'
            }
            $image = Mount-DiskImage -ImagePath $vhd -PassThru
            $disk = @($image | Get-Disk)
            if ($disk.Count -ne 1 -or $disk[0].BusType -ne 'File Backed Virtual' -or
                $disk[0].PartitionStyle -ne 'RAW' -or $disk[0].IsBoot -or $disk[0].IsSystem) {
              throw 'The new image did not resolve to a single uninitialized virtual disk'
            }
            $partition = $disk[0] | Initialize-Disk -PassThru -PartitionStyle GPT |
              New-Partition -UseMaximumSize -AssignDriveLetter
            $volume = $partition | Format-Volume -FileSystem ReFS -NewFileSystemLabel 'stdio-refs-test' -Confirm:$false
            $root = "$($volume.DriveLetter):\"
            $lab = (New-Item -ItemType Directory -Path (Join-Path $root 'lab')).FullName
            $info = & $cli storage-info $lab
            $info
            if ($LASTEXITCODE -ne 0 -or ($info -join ' ') -notmatch '\bfilesystem=ReFS\s+block_clone=1\b') {
              throw 'The test volume did not report ReFS block clone support'
            }
            foreach ($mib in @(10240, 20480, 30720)) {
              $hostFree = (Get-Item -LiteralPath $work.FullName).PSDrive.Free
              if ($hostFree -lt (($mib + 1024) * 1MB)) {
                if ($mib -eq 10240) { throw 'Insufficient host storage for the 10 GiB test' }
                Write-Output "Skipping ${mib} MiB due to insufficient host storage"
                continue
              }
              $output = & $cli prepare-large $lab $mib
              $output
              $fixture = @($output | Where-Object { $_.StartsWith('path=') })
              if ($LASTEXITCODE -ne 0 -or $fixture.Count -ne 1) { throw 'Fixture creation failed' }
              $source = Join-Path $fixture[0].Substring(5) 'file-0000000.needle'
              $destination = Join-Path $lab 'copy.bin'
              $freeBefore = (Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
              $singleCopyReport = & $cli bench-copy $source $destination
              $singleCopyReport
              if ($LASTEXITCODE -ne 0) { throw 'Copy or SHA-256 verification failed' }
              $freeAfter = (Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
              $allocated = [long]$freeBefore - [long]$freeAfter
              Write-Output "mib=$mib volume_bytes_allocated=$allocated"
              if ($allocated -gt 1GB) { throw 'Copy allocated more than 1 GiB on the ReFS volume' }
              $original = [IO.File]::OpenRead($source)
              try {
                $copy = [IO.File]::Open($destination, 'Open', 'ReadWrite', 'None')
                try {
                  $first = $original.ReadByte()
                  if ($first -lt 0 -or $copy.ReadByte() -ne $first) { throw 'Unexpected first byte' }
                  $copy.Position = 0
                  $copy.WriteByte([byte]($first -bxor 255))
                  $copy.Flush($true)
                  $original.Position = 0
                  if ($original.ReadByte() -ne $first) { throw 'Writing the copy changed the source' }
                } finally {
                  $copy.Dispose()
                }
              } finally {
                $original.Dispose()
              }
              Remove-Item -LiteralPath $destination
              if ($mib -eq 10240) {
                if ($singleCopyReport -notmatch 'sha256=([0-9a-f]{64})$') { throw 'Missing reference checksum' }
                $expectedHash = $Matches[1]
                $nested = (New-Item -ItemType Directory -Path (Join-Path $fixture[0].Substring(5) 'nested')).FullName
                $small = Join-Path $nested 'note.txt'
                [IO.File]::WriteAllText($small, 'large copy tree')
                Set-Content -LiteralPath $small -Stream 'stdio-meta' -Value 'metadata' -NoNewline
                $tree = Join-Path $lab 'tree-copy'
                $freeBefore = (Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
                $timer = [Diagnostics.Stopwatch]::StartNew()
                & $cli copy-new $tree $fixture[0].Substring(5) 4
                if ($LASTEXITCODE -ne 0) { throw 'ReFS copy-new failed' }
                $largeCopy = Join-Path $tree ([IO.Path]::GetFileName($source))
                $smallCopy = Join-Path $tree 'nested\note.txt'
                foreach ($path in @($largeCopy, $smallCopy, ($smallCopy + ':stdio-meta'))) {
                  $stream = [IO.File]::Open($path, 'Open', 'Write', 'Read')
                  try { $stream.Flush($true) } finally { $stream.Dispose() }
                }
                $timer.Stop()
                $allocated = [long]$freeBefore - [long](Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
                $stream = [IO.FileStream]::new($largeCopy, 'Open', 'Read', 'Read', 1MB, 'SequentialScan')
                try { $treeHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($stream)) }
                finally { $stream.Dispose() }
                if ((Get-Item -LiteralPath $largeCopy).Length -ne 10GB -or $treeHash -ne $expectedHash -or
                    [IO.File]::ReadAllText($smallCopy) -ne 'large copy tree' -or
                    (Get-Content -LiteralPath $smallCopy -Stream 'stdio-meta' -Raw) -ne 'metadata' -or
                    (Get-Item -LiteralPath (Join-Path $tree 'nested')).LastWriteTimeUtc -ne
                      (Get-Item -LiteralPath $nested).LastWriteTimeUtc -or $allocated -gt 1GB) {
                  throw 'ReFS tree content, metadata or clone allocation verification failed'
                }
                Write-Output "tree_mode=copy-new mib=$mib copy_and_flush_seconds=$($timer.Elapsed.TotalSeconds) net_volume_used_bytes=$allocated sha256=$treeHash"
                Remove-Item -LiteralPath $small, $smallCopy, $largeCopy
                [IO.Directory]::Delete($nested)
                [IO.Directory]::Delete((Join-Path $tree 'nested'))
                [IO.Directory]::Delete($tree)
                if ($env:GITHUB_EVENT_NAME -eq 'push') { break }
              }
              if ($mib -eq 10240 -and (Get-Item -LiteralPath $work.FullName).PSDrive.Free -gt 11GB) {
                $comparison = (New-Item -ItemType Directory -Path (Join-Path $lab 'robocopy')).FullName
                $filename = [IO.Path]::GetFileName($source)
                $baseline = Join-Path $comparison $filename
                foreach ($mode in @('clone-enabled','no-clone')) {
                  $expected = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
                  $freeBefore = (Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
                  $flags = @('/R:0', '/W:0', '/NP')
                  if ($mode -eq 'no-clone') { $flags += '/NOCLONE' }
                  $timer = [Diagnostics.Stopwatch]::StartNew()
                  $null = & robocopy.exe ([IO.Path]::GetDirectoryName($source)) $comparison $filename @flags
                  if ($LASTEXITCODE -ne 1) { throw "Robocopy did not copy exactly the requested file (exit $LASTEXITCODE)" }
                  $roboCopyTime = $timer.Elapsed.TotalSeconds
                  $stream = [IO.File]::Open($baseline, 'Open', 'Write', 'Read')
                  try { $stream.Flush($true) } finally { $stream.Dispose() }
                  $timer.Stop()
                  $allocated = [long]$freeBefore - [long](Get-Volume -DriveLetter $volume.DriveLetter).SizeRemaining
                  if ((Get-Item -LiteralPath $baseline).Length -ne ($mib * 1MB) -or
                      (Get-FileHash -LiteralPath $baseline -Algorithm SHA256).Hash -ne $expected) {
                    throw 'Robocopy length or SHA-256 mismatch'
                  }
                  if (($mode -eq 'clone-enabled' -and $allocated -gt 1GB) -or
                      ($mode -eq 'no-clone' -and $allocated -lt 9GB)) {
                    throw "Unexpected ReFS allocation delta in Robocopy mode $mode"
                  }
                  Write-Output "robocopy_mode=$mode mib=$mib copy_seconds=$roboCopyTime copy_and_flush_seconds=$($timer.Elapsed.TotalSeconds) net_volume_used_bytes=$allocated sha256=$expected"
                  Remove-Item -LiteralPath $baseline
                }
                [IO.Directory]::Delete($comparison)
                $hostInfo = & $cli storage-info $work.FullName
                if ($LASTEXITCODE -ne 0 -or ($hostInfo -join ' ') -notmatch '\bfilesystem=NTFS\s+block_clone=0\b') {
                  throw 'The temporary host directory is not on NTFS'
                }
                $crossVolume = Join-Path $work.FullName 'cross-volume.bin'
                try {
                  Write-Output 'cross_volume_source=ReFS cross_volume_destination=NTFS'
                  & $cli bench-copy $source $crossVolume
                  if ($LASTEXITCODE -ne 0) { throw 'Cross-volume copy or SHA-256 verification failed' }
                } finally {
                  if (Test-Path -LiteralPath $crossVolume -PathType Leaf) { Remove-Item -LiteralPath $crossVolume }
                }
              } elseif ($mib -eq 10240) {
                Write-Output 'Skipping the full-copy controls due to insufficient host storage'
              }
              Remove-Item -LiteralPath $source
              [IO.Directory]::Delete($fixture[0].Substring(5))
            }
          } finally {
            if (Test-Path -LiteralPath $vhd -PathType Leaf) {
              if ((Get-DiskImage -ImagePath $vhd).Attached) { Dismount-DiskImage -ImagePath $vhd }
              Remove-Item -LiteralPath $vhd
            }
            Remove-Item -LiteralPath $diskpartScript
            [IO.Directory]::Delete($work.FullName)
          }
